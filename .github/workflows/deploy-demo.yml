name: Deploy demo

# A ogni push sul branch della demo, la build va su Cloudflare Pages
# (https://gingerview-demo.pages.dev). Il workflow esiste solo in questo branch:
# `main` e le stampanti non sono coinvolti.
on:
  push:
    branches: [demo/fiera]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cartella separata: `build/` è tracciata ed è ciò che scaricano le stampanti.
      - name: Build demo
        run: npm run build
        env:
          BUILD_DIR: build-demo
          VITE_DEMO: '1'

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy build-demo --project-name gingerview-demo --branch demo/fiera --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
