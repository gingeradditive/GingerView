name: Build, Commit and Push

# A ogni push su `main`, così `build/` corrisponde sempre ai sorgenti che le
# stampanti scaricano. Il commit del bot non riattiva il workflow: i push fatti con
# GITHUB_TOKEN non generano eventi, e `paths-ignore` copre comunque `build/`.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'build/**'
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-commit-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check bundle has no addresses compiled in
        run: script/check-build.sh

      - name: Commit and push build artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add build/
          git diff --staged --quiet || git commit -m "chore: update build artifacts [skip ci]"
          git push
